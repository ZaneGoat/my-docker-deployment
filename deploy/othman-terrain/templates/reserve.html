{% extends "base.html" %}

{% block content %}
<div class="card fade-in">
    <h2><i class="fas fa-calendar-alt"></i> Réserver : {{ terrain.name }}</h2>
    <p class="price-info">Prix : <strong>{{ terrain.price_per_hour }} MAD</strong> par heure</p>

    <form method="POST">
        <div class="form-group">
            <label><i class="fas fa-calendar-day"></i> Date</label>
            <input type="date" name="date" required min="{{ today }}">
        </div>
        <div class="form-group">
            <label><i class="fas fa-clock"></i> Heure de début</label>
            <input type="time" name="time" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-hourglass-half"></i> Durée (Heures)</label>
            <input type="number" name="duration" value="1" min="1" max="5" required>
        </div>
        <div class="payment-note">
            <i class="fas fa-info-circle"></i> Le paiement s'effectue en <strong>espèces</strong> sur place.
        </div>
        <button type="submit" class="btn btn-primary w-100">Confirmer la Réservation</button>
    </form>
</div>

<style>
    .price-info {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        color: var(--accent-color);
    }
    .payment-note {
        background: rgba(246, 194, 62, 0.1);
        color: var(--accent-color);
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(246, 194, 62, 0.2);
    }
    .w-100 {
        width: 100%;
    }
</style>
{% endblock %}
