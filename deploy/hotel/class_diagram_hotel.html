<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", Arial, sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", Arial, sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#1e3a5f' : '#e6f1fb',
    primaryBorderColor: dark ? '#378add' : '#185fa5',
    primaryTextColor: dark ? '#b5d4f4' : '#0c447c',
    secondaryColor: dark ? '#1a3a2a' : '#e1f5ee',
    tertiaryColor: dark ? '#2a1a3a' : '#eeedfe',
  },
});
const { svg } = await mermaid.render('cd-svg', `classDiagram
    direction LR

    class Utilisateur {
        +int id
        +string nom_utilisateur
        +string mot_de_passe_hash
        +string role
    }

    class Chambre {
        +int id
        +string numero
        +string type
        +float prix_par_nuit
        +int etage
        +string statut
    }

    class Client {
        +int id
        +string cin
        +string prenom
        +string nom
        +string telephone
        +string email
        +string adresse
    }

    class Reservation {
        +int id
        +int client_id
        +int chambre_id
        +date date_arrivee
        +date date_depart
        +datetime check_in_reel
        +datetime check_out_reel
        +float frais_supplementaires
        +float montant_total
        +string statut
        +datetime cree_le
    }

    class Service {
        +int id
        +string nom
        +float prix
    }

    class ReservationService {
        +int id
        +int reservation_id
        +int service_id
        +int quantite
        +datetime date_consommation
    }

    class Paiement {
        +int id
        +int reservation_id
        +float montant
        +string methode
        +datetime horodatage
    }

    Client "1" --> "0..*" Reservation : effectue
    Chambre "1" --> "0..*" Reservation : attribuee a
    Reservation "1" --> "0..*" ReservationService : consomme
    Service "1" --> "0..*" ReservationService : reference par
    Reservation "1" --> "0..*" Paiement : regle par
`);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x); rect.setAttribute('y',y);
  rect.setAttribute('width',w); rect.setAttribute('height',h);
  rect.setAttribute('rx','8');
  for (const a of ['fill','stroke','stroke-width','class','style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
