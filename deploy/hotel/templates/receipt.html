<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Reçu de Paiement #{{ p.id }}</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; padding: 20px; width: 300px; margin: auto; border: 1px solid #ddd; }
        .header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 10px; margin-bottom: 10px; }
        .row { display: flex; justify-content: space-between; margin: 5px 0; }
        .total { font-weight: bold; font-size: 1.2rem; border-top: 1px solid #000; margin-top: 10px; padding-top: 10px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div class="header">
        <h3>HOTEL LUXE</h3>
        <p>REÇU DE PAIEMENT #{{ p.id }}</p>
    </div>
    
    <div class="row">
        <span>Date:</span>
        <span>{{ p.timestamp.strftime('%d/%m/%Y %H:%M') }}</span>
    </div>
    <div class="row">
        <span>Client:</span>
        <span>{{ p.reservation.client.last_name }}</span>
    </div>
    <div class="row">
        <span>Chambre:</span>
        <span>{{ p.reservation.room.number }}</span>
    </div>
    <div class="row">
        <span>Mode:</span>
        <span>{{ p.method }}</span>
    </div>
    
    <div class="row total">
        <span>MONTANT:</span>
        <span>{{ p.amount }} DH</span>
    </div>

    <div style="text-align: center; margin-top: 20px;" class="no-print">
        <button onclick="window.print()">Imprimer</button>
    </div>
</body>
</html>
