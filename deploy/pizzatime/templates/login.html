{% extends "base.html" %}

{% block title %}Connexion - Pizzeria{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 450px; margin: 5rem auto; border-top: 5px solid var(--primary-color);">
    <h2 style="text-align: center; margin-bottom: 2rem; color: var(--secondary-color);">🔐 Accès Sécurisé</h2>
    <form method="POST">
        <div class="form-group">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username" placeholder="Entrez votre nom d'utilisateur" required style="padding: 1rem; border-radius: 10px;">
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required style="padding: 1rem; border-radius: 10px;">
        </div>
        <button type="submit" style="width: 100%; margin-top: 1.5rem; font-size: 1.1rem; padding: 1.2rem;">CONNEXION IMMÉDIATE</button>
    </form>
    <p style="text-align: center; margin-top: 2rem; font-size: 0.8rem; color: #666;">Système de gestion interne - Pizzeria v2.0</p>
</div>
{% endblock %}
