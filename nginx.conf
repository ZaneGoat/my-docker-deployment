server {
    listen 80;
    server_name localhost;

    # Enable Gzip compression to significantly speed up page loads over Ngrok
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    # Root directory for all PHP apps
    root /var/www/html;
    index index.php index.html index.htm;

    # Inject FAB into every HTML page across all apps
    sub_filter '</body>' '<script src="/fab.js"></script></body>';
    sub_filter_once off;

    # ⚡ Custom Cyberpunk Error Page
    error_page 500 502 503 504 /error.html;
    location = /error.html {
        root /var/www/html;
        internal;
    }

    # ayarestoPHP and projrtZL and other PHP scripts
    location / {
        try_files $uri $uri/ =404;
    }

    # Pass PHP scripts to PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Flask App 1 (Ihsan)
    location /ihsan/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /ihsan;
        sub_filter '</body>' '<script src="/fab.js"></script></body>';
        sub_filter_once off;
    }
    location /ihsan/static/ {
        proxy_pass http://127.0.0.1:5000/static/;
        proxy_set_header Host $host;
    }

    # Flask App 2 (traiteur_evenements)
    location /traiteur/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /traiteur;
        sub_filter '</body>' '<script src="/fab.js"></script></body>';
        sub_filter_once off;
    }
    location /traiteur/static/ {
        proxy_pass http://127.0.0.1:5001/static/;
        proxy_set_header Host $host;
    }

    # Flask App 3 (Khadija)
    location /khadija/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /khadija;
        sub_filter '</body>' '<script src="/fab.js"></script></body>';
        sub_filter_once off;
    }

    # Flask App 4 (Reservation Terrain)
    location /terrain/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /terrain;
        sub_filter '</body>' '<script src="/fab.js"></script></body>';
        sub_filter_once off;
    }
    location /terrain/static/ {
        proxy_pass http://127.0.0.1:5003/static/;
        proxy_set_header Host $host;
    }

    # Flask App 6 (PizzaTime)
    location /pizzatime/ {
        proxy_pass http://127.0.0.1:5005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /pizzatime;
        proxy_redirect ~^/(.*)$ /pizzatime/$1;
        sub_filter '/static/' '/pizzatime/static/';
        sub_filter '</body>' '<script src="/fab.js"></script></body>';
        sub_filter_once off;
    }
    location /pizzatime/static/ {
        proxy_pass http://127.0.0.1:5005/static/;
        proxy_set_header Host $host;
    }

    # Flask App 7 (Hotel Management)
    location /hotel/ {
        proxy_pass http://127.0.0.1:5006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /hotel;
        proxy_redirect ~^/(.*)$ /hotel/$1;
        sub_filter '/static/' '/hotel/static/';
        sub_filter '</body>' '<script src="/fab.js"></script></body>';
        sub_filter_once off;
    }
    location /hotel/static/ {
        proxy_pass http://127.0.0.1:5006/static/;
        proxy_set_header Host $host;
    }

    # Flask App 8 (Othman Terrain)
    location /othman-terrain/ {
        proxy_pass http://127.0.0.1:5007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /othman-terrain;
        proxy_redirect ~^/(.*)$ /othman-terrain/$1;
        sub_filter '/static/' '/othman-terrain/static/';
        sub_filter '</body>' '<script src="/fab.js"></script></body>';
        sub_filter_once off;
    }
    location /othman-terrain/static/ {
        proxy_pass http://127.0.0.1:5007/static/;
        proxy_set_header Host $host;
    }

    # Django App 5 (IPIRNET)
    location /ipirnet/static/ {
        alias /var/www/html/ipirnet/staticfiles/;
    }

    location /ipirnet/media/ {
        alias /var/www/html/ipirnet/media/;
    }

    location /ipirnet/ {
        auth_basic "IPIRNET V7 - Secure Access";
        auth_basic_user_file /var/www/html/.htpasswd;
        proxy_pass http://127.0.0.1:5004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /ipirnet;
    }
}
